# seeds/scene_events.yaml — the OKC scene calendar (PLAN.md §7) plus the
# festival + competition deadline calendar (PLAN.md §3/§6). One table, split by
# `kind`: recurring events, festivals, and competitions all ride here; the
# cadence engine (next-date computation) lands in M6.
#
# `cadence` is a small structured recurrence the M6 engine will read. Facts
# below were checked in the M4 research session (July 2026); where a date/night
# could not be confirmed this session it is flagged in `notes` ("confirm ...").
# No event, venue, or date is invented.

# ── Recurring scene events (where to be) ────────────────────────────────────
- name: First Friday Gallery Walk (Paseo Arts District)
  kind: art_walk
  venue: Paseo Arts District
  area: Oklahoma City
  url: https://www.thepaseo.org/paseo-first-friday-gallery-walk
  cadence: {freq: monthly, week: 1, weekday: friday, start: "18:00", end: "21:00"}
  playbook: scene-ledger
  notes: >-
    First Friday every month, 6–9pm, 25+ galleries + live music. Ambient improv
    fits gallery openings (free-improv-arbitrage) and it's where the scene meets.
