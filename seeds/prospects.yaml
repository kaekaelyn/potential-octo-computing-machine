# seeds/prospects.yaml — researched OKC-metro prospects (PLAN.md §6/§12 M4).
#
# VERIFICATION CONVENTION (CLAUDE.md hard rule: no fabricated data):
#   * verified: true   — the place and the fields recorded here were confirmed
#                        against a public source during the M4 research session
#                        (July 2026). Websites/addresses/phones below were taken
#                        verbatim from those sources, never invented.
#   * verified: false  — the place is plausible/known but was NOT confirmed this
#                        session, OR a factual detail (e.g. an arts program)
#                        needs checking. Treated as "confirm before pitching."
#   * A contact field is left EMPTY whenever it wasn't found. Vamp never invents
#     a phone number, email, or address to fill a row.
#
# `angle` is strategy, not fact — the one-line reason a pitch to THIS place
# lands. `has_piano` is only true where the piano is evidenced (a piano bar, a
# dance studio with live accompaniment); left blank (unknown) otherwise.

