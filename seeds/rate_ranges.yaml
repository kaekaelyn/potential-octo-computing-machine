# seeds/rate_ranges.yaml — researched market rate ranges by gig type (PLAN.md
# §8). These anchor the rate card and the below-floor chips (M6).
#
# IMPORTANT: most published rate data is national/regional, not OKC-specific.
# Those rows are marked `verified: false` with the benchmark source in `source`
# and a note to localize before quoting — an honest range beats a fake-precise
# OKC number. The one genuinely OKC-scoped figure (an aggregate of local pianist
# bookings) is `verified: true` and labeled as a sanity-check, not a quote.
# Numbers are USD and were not invented — each traces to the cited source.

