name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pure-Python dependency check
        run: python scripts/check_pure_python_deps.py

      - name: Lint (ruff)
        run: |
          ruff format --check .
          ruff check .

      - name: Test (pytest)
        run: pytest
